name: Deploy to Zeabur via GHCR

on:
  push:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        run: npm install -g pnpm@latest
        
      - name: Run security scan
        run: node scripts/security-scan.js

  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Convert repository name to lowercase
        run: |
          echo "IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-zeabur:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Zeabur Redeploy via GraphQL API
        env:
          ZEABUR_API_TOKEN: ${{ secrets.ZEABUR_API_TOKEN }}
          SERVICE_ID: ${{ secrets.ZEABUR_SERVICE_ID }}
          ENVIRONMENT_ID: ${{ secrets.ZEABUR_ENVIRONMENT_ID }}
        if: env.ZEABUR_API_TOKEN != '' && env.SERVICE_ID != '' && env.ENVIRONMENT_ID != ''
        run: |
          curl --request POST \
            --url https://api.zeabur.com/graphql \
            --header "Authorization: Bearer ${{ secrets.ZEABUR_API_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"query\":\"mutation { restartService(serviceID: \\\"${{ secrets.ZEABUR_SERVICE_ID }}\\\", environmentID: \\\"${{ secrets.ZEABUR_ENVIRONMENT_ID }}\\\") }\"}"
